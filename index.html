<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Quiz JLPT N5</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #ff4757;
      --secondary: #2f3542;
      --accent: #70a1ff;
      --bg-gradient: linear-gradient(135deg, #f6f9fc 0%, #eef2f3 100%);
      --glass: rgba(255, 255, 255, 0.95);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --timer-track: #dcdde1; /* Lebih kontras */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* Hapus highlight biru di mobile */
      outline: none;
      user-select: none;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: var(--secondary);
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px; /* Dipersempit agar lebih fokus di mobile */
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card {
      background: var(--glass);
      border-radius: 30px;
      padding: 30px;
      width: 100%;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 1);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      position: relative;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 2em;
      text-align: center;
      margin: 0 0 5px;
      color: var(--secondary);
      font-weight: 800;
    }

    p.subtitle {
      text-align: center;
      color: #747d8c;
      font-size: 0.9em;
      margin: 0 0 30px;
    }

    /* Selection Grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .option-btn {
      padding: 15px;
      font-size: 1.2em;
      font-weight: 700;
      background: white;
      border: 2px solid #dfe4ea;
      border-radius: 15px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      color: var(--secondary);
    }

    .option-btn.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
      transform: scale(1.05);
    }

    .btn-main {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 1.1em;
      font-weight: 600;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 25px;
      transition: transform 0.2s;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-main:disabled {
      background: #ced6e0;
      cursor: default;
      transform: none;
    }

    /* Loading Overlay - Improved Positioning */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.95);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #eee;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay p {
      font-size: 1.2em;
      font-weight: 600;
      color: var(--secondary);
      margin: 0;
    }

    #loading-overlay span {
      font-size: 0.9em;
      color: #747d8c;
      margin-top: 8px;
    }

    /* Quiz Layout */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding: 0 5px;
    }

    /* Timer - High Contrast */
    .timer-container {
      position: relative;
      width: 50px;
      height: 50px;
    }

    .timer-circle {
      transform: rotate(-90deg);
      width: 50px;
      height: 50px;
    }

    .timer-circle circle {
      cx: 25;
      cy: 25;
      r: 22;
      fill: none;
      stroke-width: 5;
    }

    .bg-ring {
      stroke: var(--timer-track); /* Lebih gelap untuk kontras */
    }

    .progress-ring {
      stroke: var(--primary);
      stroke-dasharray: 138; /* 2 * PI * 22 */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
      stroke-linecap: round;
    }

    .timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1em;
      font-weight: 800;
      color: var(--secondary);
    }

    .question-badge {
      background: #dfe4ea;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 600;
      color: var(--secondary);
    }

    #question-text {
      font-size: 1.8em; /* Lebih besar & jelas */
      text-align: center;
      margin: 10px 0 30px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--secondary);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-item {
      position: relative;
      display: flex;
      align-items: center;
      padding: 18px 20px;
      background: white;
      border: 2px solid #f1f2f6;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-item:active {
      transform: scale(0.98);
    }

    .option-item input {
      display: none;
    }

    .option-item span {
      font-size: 1.1em;
      font-weight: 500;
      margin-left: 10px;
      flex: 1;
    }

    /* States */
    .option-item.correct {
      background: #2ecc71;
      border-color: #2ecc71;
      color: white;
    }

    .option-item.wrong {
      background: #ff4757;
      border-color: #ff4757;
      color: white;
    }

    /* Result Screen - Clean */
    .score-big {
      font-size: 4em;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin: 20px 0 0;
      line-height: 1;
    }

    .score-label {
      text-align: center;
      color: #747d8c;
      font-size: 1em;
      margin-bottom: 30px;
    }

    .stats-mini {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-box strong {
      display: block;
      font-size: 1.4em;
      color: var(--secondary);
    }

    .stat-box small {
      color: #a4b0be;
      font-size: 0.8em;
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 480px) {
      .container { padding: 15px; }
      .card { padding: 25px 20px; border-radius: 25px; }
      h1 { font-size: 1.6em; }
      
      /* Timer contrast adjustment for small screens */
      .timer-container { width: 44px; height: 44px; }
      .timer-circle { width: 44px; height: 44px; }
      .timer-circle circle { cx: 22; cy: 22; r: 19; }
      .timer-text { font-size: 1em; } /* Angka timer jelas */
      
      .options-grid { gap: 10px; }
      .option-btn { padding: 12px; font-size: 1em; }
      
      #question-text { font-size: 1.5em; margin: 10px 0 25px; }
      .option-item { padding: 16px; }
      .option-item span { font-size: 1em; }
    }
  </style>
</head>
<body>

  <!-- Audio -->
  <audio id="sfx-click" src="https://assets.mixkit.co/sfx/preview/mixkit-modern-click-box-check-1120.mp3"></audio>
  <audio id="sfx-correct" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="sfx-wrong" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-bass-buzzer-948.mp3"></audio>
  <audio id="sfx-end" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-notification-2018.mp3"></audio>

  <!-- Loading -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-main">Memuat Soal...</p>
    <span id="loading-sub">Menghubungi AI</span>
  </div>

  <div class="container">
    
    <!-- Screen 1: Selection -->
    <div id="screen-select" class="card">
      <h1>🇯🇵 JLPT N5</h1>
      <p class="subtitle">Latihan Cepat Hiragana, Katakana, Kanji</p>
      
      <div style="text-align:center; font-weight:600; margin-bottom:10px;">Jumlah Soal</div>
      <div class="options-grid">
        <div class="option-btn" onclick="selectCount(15, this)">15</div>
        <div class="option-btn" onclick="selectCount(30, this)">30</div>
        <div class="option-btn" onclick="selectCount(45, this)">45</div>
        <div class="option-btn" onclick="selectCount(60, this)">60</div>
        <div class="option-btn" onclick="selectCount(75, this)">75</div>
        <div class="option-btn" onclick="selectCount(90, this)">90</div>
      </div>

      <button id="btn-start" class="btn-main" disabled onclick="startQuiz()">Mulai</button>
    </div>

    <!-- Screen 2: Quiz -->
    <div id="screen-quiz" class="card" style="display:none;">
      <div class="quiz-header">
        <div class="question-badge" id="q-progress">1 / 15</div>
        
        <!-- Timer Kontras -->
        <div class="timer-container">
          <svg class="timer-circle">
            <circle class="bg-ring" />
            <circle class="progress-ring" />
          </svg>
          <div class="timer-text" id="timer-val">30</div>
        </div>
      </div>

      <h2 id="question-text">Loading...</h2>
      <div class="options-list" id="options-container"></div>
      
      <button id="btn-next" class="btn-main" style="display:none; background:var(--primary);" onclick="nextQuestion()">Lanjut</button>
    </div>

    <!-- Screen 3: Result -->
    <div id="screen-result" class="card" style="display:none;">
      <h1 style="font-size:1.5em; margin-bottom:0;">Selesai!</h1>
      <div class="score-big" id="res-score">0</div>
      <p class="score-label" id="res-msg">Poin Kamu</p>

      <div class="stats-mini">
        <div class="stat-box">
          <strong id="res-correct" style="color:#2ecc71">0</strong>
          <small>Benar</small>
        </div>
        <div class="stat-box">
          <strong id="res-wrong" style="color:#ff4757">0</strong>
          <small>Salah</small>
        </div>
        <div class="stat-box">
          <strong id="res-time">0s</strong>
          <small>Avg</small>
        </div>
      </div>

      <button class="btn-main" onclick="location.reload()">Main Lagi</button>
    </div>

  </div>

  <script>
    // --- Config & State ---
    const API_URL = "https://api.nekolabs.web.id/text.gen/gemini/2.5-flash-lite?text=";
    let config = { count: 0 };
    let state = {
      questions: [],
      currentIdx: 0,
      score: 0,
      timer: null,
      timeLeft: 30,
      totalTime: 0,
      answeredCount: 0
    };

    // --- Audio ---
    const sfx = {
      click: document.getElementById('sfx-click'),
      correct: document.getElementById('sfx-correct'),
      wrong: document.getElementById('sfx-wrong'),
      end: document.getElementById('sfx-end')
    };
    const play = (audio) => { audio.currentTime = 0; audio.play().catch(()=>{}); };

    // --- UI Helpers ---
    const getEl = (id) => document.getElementById(id);
    
    // Select Count
    function selectCount(num, el) {
      play(sfx.click);
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      config.count = num;
      getEl('btn-start').disabled = false;
      getEl('btn-start').style.background = 'var(--primary)';
    }

    // --- Core Logic ---
    async function startQuiz() {
      play(sfx.click);
      getEl('screen-select').style.display = 'none';
      getEl('loading-overlay').style.display = 'flex';
      
      try {
        await generateQuestions();
        getEl('loading-overlay').style.display = 'none';
        getEl('screen-quiz').style.display = 'block';
        renderQuestion();
      } catch (e) {
        alert("Gagal memuat soal. Silakan coba lagi.");
        location.reload();
      }
    }

    async function generateQuestions() {
      const prompt = `Buatkan ${config.count} soal quiz JLPT N5 (Hiragana, Katakana, Kanji). 
        Format JSON array murni tanpa markdown. 
        Setiap objek: { "type": "kanji/hiragana/katakana", "question": "pertanyaan pendek", "options": ["A","B","C","D"] (semua unik), "answer": "jawaban benar" }.
        Pastikan options unik.`;
        
      getEl('loading-sub').textContent = "Mengambil data...";
      
      // Fetch logic with retry/accumulation simpler for this clean version
      // We will fetch in chunks if needed, but for simplicity here we assume API handles reasonable load or we fetch once.
      // To ensure reliability for user request "Lengkap", I'll include the loop logic briefly but cleaner.
      
      let collected = [];
      let attempts = 0;
      
      while(collected.length < config.count && attempts < 5) {
        attempts++;
        getEl('loading-sub').textContent = `Memproses... (${collected.length}/${config.count})`;
        
        try {
          const res = await fetch(API_URL + encodeURIComponent(prompt));
          const data = await res.json();
          if(!data.success) continue;
          
          let cleanJson = data.result.replace(/```json|```/g, '').trim();
          // Fix potential array wrapping issues if any
          if(cleanJson.startsWith('{')) { 
             const parsed = JSON.parse(cleanJson);
             if(parsed.questions) collected = collected.concat(parsed.questions);
          } else if (cleanJson.startsWith('[')) {
             collected = collected.concat(JSON.parse(cleanJson));
          }
          
          // Deduplicate
          collected = collected.filter((v,i,a)=>a.findIndex(t=>(t.question===v.question))===i);
        } catch(e) { console.error(e); }
      }

      state.questions = collected.slice(0, config.count);
      // Fallback mock if API fails completely to ensure app doesn't break
      if(state.questions.length === 0) {
        throw new Error("Empty Data");
      }
    }

    function renderQuestion() {
      const q = state.questions[state.currentIdx];
      
      // Update Text
      getEl('q-progress').textContent = `${state.currentIdx + 1} / ${state.questions.length}`;
      getEl('question-text').textContent = q.question;
      
      // Render Options
      const container = getEl('options-container');
      container.innerHTML = '';
      getEl('btn-next').style.display = 'none';

      q.options.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerHTML = `<span>${opt}</span>`;
        div.onclick = () => checkAnswer(opt, q.answer, div);
        container.appendChild(div);
      });

      // Reset Timer
      startTimer();
    }

    function startTimer() {
      clearInterval(state.timer);
      state.timeLeft = 30;
      updateTimerUI(30);
      
      state.timer = setInterval(() => {
        state.timeLeft--;
        updateTimerUI(state.timeLeft);
        if(state.timeLeft <= 0) {
          clearInterval(state.timer);
          handleTimeUp();
        }
      }, 1000);
    }

    function updateTimerUI(sec) {
      getEl('timer-val').textContent = sec;
      // Calculate offset for circle (radius approx 19 or 22 based on media query)
      // We use percentage for simplicity in CSS stroke-dashoffset logic
      // Full circle is ~138px circumference for r=22
      // Mobile r=19 -> circ ~119
      // Simplest way: just rely on numeric countdown for user, visual ring is extra
      const circle = document.querySelector('.progress-ring');
      const r = window.innerWidth < 480 ? 19 : 22;
      const c = 2 * Math.PI * r;
      const offset = c - ((sec / 30) * c);
      circle.style.strokeDasharray = c;
      circle.style.strokeDashoffset = offset;
    }

    function checkAnswer(selected, correct, el) {
      if(getEl('options-container').classList.contains('locked')) return;
      
      clearInterval(state.timer);
      getEl('options-container').classList.add('locked'); // Prevent multiple clicks
      
      state.answeredCount++;
      state.totalTime += (30 - state.timeLeft);

      const items = document.querySelectorAll('.option-item');
      
      if(selected === correct) {
        el.classList.add('correct');
        state.score++;
        play(sfx.correct);
      } else {
        el.classList.add('wrong');
        play(sfx.wrong);
        // Highlight correct one
        items.forEach(item => {
          if(item.innerText === correct) item.classList.add('correct');
        });
      }

      setTimeout(() => {
        if(state.currentIdx < state.questions.length - 1) {
          state.currentIdx++;
          getEl('options-container').classList.remove('locked');
          renderQuestion();
        } else {
          finishQuiz();
        }
      }, 1500); // Auto next after 1.5s
    }

    function handleTimeUp() {
      getEl('options-container').classList.add('locked');
      play(sfx.wrong);
      
      // Show correct answer
      const q = state.questions[state.currentIdx];
      document.querySelectorAll('.option-item').forEach(item => {
        if(item.innerText === q.answer) item.classList.add('correct');
      });

      setTimeout(() => {
        if(state.currentIdx < state.questions.length - 1) {
          state.currentIdx++;
          getEl('options-container').classList.remove('locked');
          renderQuestion();
        } else {
          finishQuiz();
        }
      }, 1500);
    }

    function finishQuiz() {
      getEl('screen-quiz').style.display = 'none';
      getEl('screen-result').style.display = 'block';
      play(sfx.end);

      getEl('res-score').textContent = Math.round((state.score / state.questions.length) * 100);
      getEl('res-correct').textContent = state.score;
      getEl('res-wrong').textContent = state.questions.length - state.score;
      
      const avg = state.answeredCount > 0 ? Math.round(state.totalTime / state.answeredCount) : 0;
      getEl('res-time').textContent = avg + 's';

      const pct = (state.score / state.questions.length) * 100;
      getEl('res-msg').textContent = pct >= 80 ? "Hebat Sekali! 🎉" : (pct >= 60 ? "Kerja Bagus! 👍" : "Jangan Menyerah! 💪");
    }
  </script>
</body>
</html>
